name: Deploy to AWS (EC2)

# Triggered on push to main. Builds the monorepo, then SSHs into EC2
# to pull the latest code and reload the pm2 process.
#
# Required GitHub Secrets:
#   EC2_HOST           — public IP or hostname of your EC2 instance
#   EC2_USER           — SSH user (e.g. ubuntu or ec2-user)
#   EC2_SSH_KEY        — private SSH key (contents of .pem file)
#   GH_PAT             — GitHub classic PAT with repo scope (for git pull on server)
#   GH_USERNAME        — GitHub username that owns the PAT
#
# Optional — set these if you want to scope deploys to specific apps:
#   APP_DIR            — absolute path on EC2 to repo root (default: ~/app)
#
# If EC2_HOST is not set, all steps after checkout are skipped gracefully.

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Guard: skip everything below if EC2_HOST secret is not configured.
      # (Template repos won't have this set — this prevents CI from failing
      # on the template itself. Child projects bootstrapped from this template
      # will have EC2_HOST set and will proceed normally.)
      - name: Check EC2 configuration
        id: check
        run: |
          if [ -n "${{ secrets.EC2_HOST }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️  EC2_HOST secret not set — skipping deployment"
            echo "configured=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.check.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        if: steps.check.outputs.configured == 'true'
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install dependencies
        if: steps.check.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build all apps
        if: steps.check.outputs.configured == 'true'
        run: pnpm build
        env:
          # Pass any required build-time env vars here via secrets
          NEXT_PUBLIC_PRIVATE_KEY: ${{ secrets.NEXT_PUBLIC_PRIVATE_KEY }}
          NEXT_PUBLIC_BACKEND_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}

      - name: Deploy to EC2
        if: steps.check.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ${{ secrets.APP_DIR || '~/app' }}

            # Authenticate git pull using PAT embedded in remote URL
            git remote set-url origin https://${{ secrets.GH_USERNAME }}:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git

            git pull origin main

            # Install deps and rebuild on the server
            pnpm install --frozen-lockfile
            pnpm build

            # Reload pm2 processes (graceful restart — zero downtime)
            pm2 reload ecosystem.config.js --update-env || pm2 restart all

            echo "✅ Deployed successfully"
